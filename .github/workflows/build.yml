name: Build proof of concept
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/ProtocolTests.csproj
      - shell: pwsh
        run: ./tools/publish-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NotebookScanner-Windows-x64-UNSIGNED
          path: |
            dist/win-x64/NotebookScanner.exe
            dist/win-x64/LICENSES/
            dist/win-x64/THIRD_PARTY_NOTICES.md
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Check saved-device policy without Android hardware
        run: |
          mkdir -p .tools/java-policy-tests
          javac -d .tools/java-policy-tests android/app/src/main/java/org/notebookscanner/DeviceHistory.java tests/android/DeviceHistoryTest.java
          java -cp .tools/java-policy-tests org.notebookscanner.DeviceHistoryTest
      - run: gradle -p android assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NotebookScanner-Android-DEBUG-TEST-ONLY
          path: android/app/build/outputs/apk/debug/app-debug.apk

